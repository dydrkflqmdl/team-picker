<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>팀 현황</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="style.css?v=2" /><!-- style.css 를 고치면 v 숫자를 올린다 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"
          integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R"
          crossorigin="anonymous"></script>
  <!-- common.js 를 고치면 v 숫자를 올린다(브라우저에 남아 있는 예전 common.js 를 새 화면이 쓰지 않게) -->
  <script src="common.js?v=5"></script>
  <style>
    .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .stats { color: var(--muted); }
    .stats b { color: var(--text); font-size: 18px; }
    .columns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
    @media (max-width: 900px) { .columns { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .columns { grid-template-columns: 1fr; } }
    .col { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .col h3 { margin: 0; padding: 12px 14px; font-size: 18px; display: flex; justify-content: space-between; }
    .col .mix { padding: 6px 14px 0; font-size: 13px; color: var(--muted); }
    .col ol { margin: 0; padding: 6px 14px 14px 36px; min-height: 60px; }
    .col li { padding: 3px 0; }
    .col li.new { animation: flash 2.5s ease-out; border-radius: 6px; }
    @keyframes flash { from { background: color-mix(in srgb, var(--accent) 35%, transparent); } }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { background: var(--chip); border-radius: 999px; padding: 3px 12px; font-size: 14px; }
    .empty { color: var(--muted); font-size: 14px; }
    /* 조식: 메뉴마다 "메뉴 이름 N명" + 고른 사람들 */
    .menu-group + .menu-group { margin-top: 16px; }
    .menu-group p { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
    .menu-group p b { font-size: 17px; }
    .menu-group.none p { color: var(--muted); font-weight: 400; }
    details.card > summary { cursor: pointer; font-weight: 600; }
    details.card > summary small { color: var(--muted); font-weight: 400; font-size: 13px; }
    details.card[open] > summary { margin-bottom: 14px; }
    /* 명단 관리의 분류: 단추마다 "이름 인원수". 누르면 표에 그 사람들만 보이고, 한 번 더 누르면 풀림 */
    .facet { display: flex; gap: 10px; align-items: baseline; margin-bottom: 8px; }
    .facet-name { flex: none; width: 2.4em; color: var(--muted); font-size: 13px; }
    .chip.pick { border: 0; padding: 5px 12px; color: inherit; }
    .chip.pick b { margin-left: 2px; }
    .chip.pick.zero { opacity: .55; }
    .chip.pick[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); opacity: 1; }
    .tools { margin-top: 14px; }
    .tools input { flex: 1 1 200px; max-width: 320px; margin: 0; padding: 8px 12px; }
    .people { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; margin: 8px 0 16px; } /* separate: 붙어 있는 머리글 위로 아래 줄이 비쳐 보이지 않게 */
    .people th, .people td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); }
    .people th { color: var(--muted); font-weight: 500; position: sticky; top: 0; z-index: 1; background: var(--card); box-shadow: 0 1px 0 var(--line); }
    /* 표 머리글을 누르면 그 칸으로 정렬(한 번 더 누르면 거꾸로) */
    .people th button { padding: 2px 0; font-size: inherit; font-weight: inherit; color: inherit; text-decoration: none; }
    .people th[aria-sort] button { color: var(--text); font-weight: 600; }
    .people th[aria-sort="ascending"] button::after { content: ' ▲'; font-size: 10px; }
    .people th[aria-sort="descending"] button::after { content: ' ▼'; font-size: 10px; }
    .people td:last-child { text-align: right; white-space: nowrap; }
    .people td.empty { text-align: left; white-space: normal; }
    #peopleBody.busy tr:not(.editing) { opacity: .5; } /* 저장하는 동안 */
    .people .dot { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; }
    .people tr.editing td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
    .people input, .people select { margin: 0; padding: 4px 6px; font-size: 14px; border-radius: 6px; min-width: 64px; }
    .table-wrap { max-height: 480px; max-height: min(70vh, 640px); overflow: auto; scroll-padding-top: 44px; } /* scroll-padding: 초점이 간 줄이 붙어 있는 머리글에 가리지 않게 */
    /* 좁은 화면: 칸을 줄바꿈하지 않고(글자가 세로로 한 자씩 쪼개짐) 표 안에서 옆으로 밀어 봄 */
    @media (max-width: 700px) { .people th, .people td { white-space: nowrap; } }
    .row.end { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
    .msg { font-size: 14px; color: var(--muted); }
    /* 오류 문구: 아래쪽 명단 표에서 일하는 중에도 보이게, 화면을 내려도 위에 붙어 있음 */
    #error:not(:empty) { position: sticky; top: 8px; z-index: 5; padding: 10px 12px; border-radius: 10px;
                         background: var(--card); border: 1px solid var(--danger); box-shadow: 0 4px 16px rgb(0 0 0 / .12); }
    .people td:last-child button { padding: 6px 3px; } /* 수정·다시 뽑기·삭제를 잘못 누르지 않게 누르는 자리를 조금 넓힘 */
    /* 일정표(참가자 화면에도 보임)와 준비해 둔 기능(객실표·자유시간 — 진행자 화면에만 있음): 접어 둔 칸 */
    .section { margin: 28px 0 10px; font-size: 15px; }
    .section small { display: block; margin-top: 2px; color: var(--muted); font-weight: 400; font-size: 13px; }
    .rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-bottom: 16px; } /* 넓은 화면에서는 남자 방 5개가 한 줄 */
    .room { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
    .room h3 { margin: 0 0 6px; font-size: 15px; display: flex; justify-content: space-between; align-items: baseline; }
    .room h3 span:last-child { color: var(--muted); font-weight: 400; font-size: 13px; }
    .room ul { list-style: none; margin: 0; padding: 0; }
    .room li { display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: baseline; padding: 3px 0; }
    .room .warn { color: var(--danger); font-size: 12px; }
    /* "직접 옮기기"·"직접 고치기"를 켰을 때 이름 옆에 나오는 고르는 칸 */
    select.seat { display: inline-block; width: auto; margin: 0 0 0 auto; padding: 3px 6px; font-size: 13px; border-radius: 6px; }
    .chip select.seat { margin-left: 6px; }
    /* "직접 고치기"를 켠 목록: 한 사람이 한 줄 — 이름은 왼쪽, 고르는 칸은 오른쪽 끝(휴대폰에서는 한 줄에 한 명, 넓은 화면에서는 여러 칸) */
    .menu-group.picking .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
    .menu-group.picking .chip { display: flex; align-items: center; gap: 6px; border-radius: 12px; padding: 6px 8px 6px 12px; }
    .menu-group.picking .chip select.seat { margin-left: auto; }
    /* 휴대폰: 손가락으로 누르기 좋게 키우고, 칸을 누를 때 화면이 확대되지 않게 글자를 16px 로 */
    @media (max-width: 700px) {
      select.seat, .tools2 select { font-size: 16px; padding: 8px 10px; min-height: 40px; }
      .room li { align-items: center; }
      label.check { min-height: 40px; align-items: center; font-size: 15px; }
      label.check input { width: 20px; height: 20px; }
      .tools2 button.link, #planEdit button.link { padding: 10px 4px; font-size: 14px; }
    }
    .tools2 { margin-top: 14px; gap: 8px 14px; }
    .tools2 label { margin: 0; }
    .tools2 select { display: inline-block; width: auto; margin: 0 0 0 4px; padding: 6px 8px; font-size: 14px; }
    label.check { display: flex; gap: 8px; align-items: baseline; margin: 0; font-size: 14px; color: var(--text); cursor: pointer; }
    label.check input { flex: none; display: inline-block; width: auto; margin: 0; }
    #planEdit { margin-top: 14px; }
    #planInput { min-height: 220px; }
    @media (prefers-reduced-motion: reduce) { .col li.new { animation: none; } }
  </style>
</head>
<body>
<main>
  <div class="head">
    <h1>팀 현황</h1>
    <span class="stats" id="stats"></span>
  </div>
  <p class="error" id="error" role="alert"></p>

  <section class="card" id="codeCard" hidden style="max-width: 420px">
    <form id="codeForm">
      <label>관리자 비밀번호
        <input id="code" type="password" required autocomplete="current-password" />
      </label>
      <button class="primary block" type="submit">확인</button>
    </form>
  </section>

  <div id="boardView" hidden>
    <div class="columns" id="columns"></div>

    <section class="card">
      <h2>아직 안 뽑은 사람 <small id="waitingCount"></small></h2>
      <div class="chips" id="waiting"></div>
    </section>

    <section class="card">
      <h2>12월 18일 금요일 조식 <small id="menuCount"></small></h2>
      <div id="menus"></div>
    </section>

    <!-- 일정표: 여기서 적은 글이 참가자 화면(메인 화면·일정표 보기)에 그대로 나온다 -->
    <details class="card" id="planCard">
      <summary>일정표 <small>· 참가자 화면에도 보여요</small> <small id="planCount"></small></summary>
      <div id="plan"></div>
      <div class="row tools2">
        <button class="link" id="planEditBtn">일정 고치기</button>
      </div>
      <div id="planEdit" hidden>
        <label>날짜는 한 줄에 따로 적고, 일정은 <b>시간 내용</b>으로 한 줄에 하나씩 적어요 (예: <b>10:00 도착</b>, <b>14:00~16:00 팀 게임</b>)
          <textarea id="planInput" maxlength="4000" placeholder="12월 17일 (목)&#10;13:00 도착&#10;18:00 저녁 식사"></textarea>
        </label>
        <div class="row">
          <button class="primary" id="planSave">저장</button>
          <button id="planCancel">취소</button>
          <button class="link" id="planSample" style="margin-left:auto">예시 넣기</button>
        </div>
      </div>
    </details>

    <!-- 준비해 둔 기능(시험용): 진행자 화면에만 있다. 참가자 화면(index.html)에는 이 기능이 없고, 참가자가 부를 수 있는 DB 함수도 없다 -->
    <h2 class="section">준비해 둔 기능 (시험용)
      <small>객실표·자유시간이에요. <b>진행자 화면에서만</b> 보이고, 참가자 화면에는 나오지 않아요.</small>
    </h2>

    <details class="card" id="roomCard">
      <summary>객실표 <small id="roomCount"></small></summary>
      <div class="rooms" id="rooms"></div>
      <div id="roomless"></div>
      <div class="row tools2">
        <label>나누는 기준
          <select id="roomRule">
            <option value="rank">직급이 비슷한 사람끼리</option>
            <option value="dept">같은 부서끼리</option>
            <option value="team">같은 팀끼리</option>
            <option value="mix">무작위로 섞기</option>
          </select>
        </label>
        <button class="primary" id="roomAuto">자동으로 나누기</button>
        <button id="roomFill" hidden>방 없는 사람만 넣기</button>
        <label class="check"><input type="checkbox" id="roomMove" /> 직접 옮기기</label>
        <button class="link danger" id="roomClear" style="margin-left:auto">객실 모두 비우기</button>
      </div>
      <p class="msg" id="roomMsg" role="status"></p>
    </details>

    <details class="card" id="actCard">
      <summary>저녁 식사 뒤 자유시간 <small id="actCount"></small></summary>
      <div id="acts"></div>
      <div class="row tools2">
        <label class="check"><input type="checkbox" id="actMove" /> 직접 고치기</label>
        <button class="link danger" id="actClear" style="margin-left:auto">고른 것 모두 지우기</button>
      </div>
    </details>

    <details class="card" id="admin">
      <summary>명단 관리 <small id="totalCount"></small></summary>

      <div id="facets"></div>
      <div class="row tools">
        <input id="q" type="search" placeholder="이름·부서·직급으로 찾기" aria-label="명단에서 찾기" autocomplete="off" />
        <span class="msg" id="shown" role="status"></span>
        <button class="link" id="clearView" hidden>조건 지우기</button>
        <button class="link" id="exportBtn" style="margin-left:auto">보이는 명단을 엑셀 파일로 받기</button>
      </div>

      <div class="table-wrap">
        <table class="people">
          <thead><tr>
            <th aria-sort="ascending"><button class="link" data-sort="dept">부서</button></th>
            <th><button class="link" data-sort="name">이름</button></th>
            <th><button class="link" data-sort="title">직급</button></th>
            <th><button class="link" data-sort="gender">성별</button></th>
            <th><button class="link" data-sort="team">팀</button></th>
            <th><button class="link" data-sort="menu">조식</button></th>
            <th></th>
          </tr></thead>
          <tbody id="peopleBody"></tbody>
        </table>
        <datalist id="deptList"></datalist>
      </div>

      <label>명단 추가 — 엑셀에서 <b>이름·직급·성별·부서</b> 4칸을 그대로 복사해 붙여넣거나, 한 줄에 <b>이름, 부서</b>
        <textarea id="rosterInput" placeholder="홍길동	대리	남	영상사업부&#10;김철수, 영상사업부"></textarea>
      </label>
      <div class="row">
        <button class="primary" id="addBtn">추가</button>
        <span class="msg" id="addMsg"></span>
      </div>

      <div class="row end">
        <button class="danger" id="resetAll">전체 다시 뽑기(팀·조식 초기화)</button>
        <button class="danger" id="removeAll">명단 전체 삭제</button>
        <button class="link" id="forget" style="margin-left:auto">이 기기에서 비밀번호 지우기</button>
      </div>
    </details>
  </div>
</main>

<script>
  const CODE_KEY = 'team-picker-admin';
  let code = store.get(CODE_KEY);
  let people = [];
  let conf = { schedule: '' }; // 일정표 글
  let seen = null; // 이미 화면에 나온 배정("id:팀") — 새로 뽑힌 사람만 깜빡이게
  let drawn = '';  // 마지막으로 그린 명단. 바뀐 게 없으면 다시 그리지 않음(누르려던 단추가 그 순간 새로 그려져 눌림이 사라지는 일을 막음)
  let seq = 0;     // 새로고침 요청 번호. 늦게 도착한 예전 답이 더 새 화면을 덮어쓰지 않게 함
  let loading = 0; // 답을 기다리는 새로고침 수
  let editing = null; // 수정 중인 사람 id — 그동안은 5초 새로고침이 입력칸을 지우지 않게 명단 표를 다시 그리지 않음

  function render() {
    const picked = people.filter((p) => p.team);
    const waiting = people.filter((p) => !p.team);
    $('#stats').innerHTML = `전체 <b>${people.length}</b>명 · 뽑음 <b>${picked.length}</b>명 · 남음 <b>${waiting.length}</b>명`;

    $('#columns').innerHTML = TEAM_KEYS.map((t) => {
      const list = picked.filter((p) => p.team === t);
      const execs = list.filter((p) => p.is_exec).length;
      const women = list.filter((p) => p.gender === '여').length;
      return `
        <div class="col">
          <h3 class="team-${t}"><span>${TEAMS[t]}</span><span>${list.length}명</span></h3>
          <div class="mix">임원 ${execs} · 여성 ${women}</div>
          <ol>${list.map((p) => `<li class="${seen && !seen.has(`${p.id}:${p.team}`) ? 'new' : ''}">${esc(p.name)} <span class="hint">${p.title ? esc(p.title) + ' · ' : ''}${esc(p.dept)}</span></li>`).join('')}</ol>
        </div>`;
    }).join('');
    seen = new Set(picked.map((p) => `${p.id}:${p.team}`));

    const chip = (p) => `<span class="chip">${esc(p.name)} <span class="hint">${esc(p.dept)}</span></span>`;
    $('#waitingCount').textContent = `${waiting.length}명`;
    $('#waiting').innerHTML = waiting.length
      ? waiting.map(chip).join('')
      : `<span class="empty">${people.length ? '모두 뽑았어요!' : '아직 명단이 없어요. 아래 명단 관리에서 추가하세요.'}</span>`;

    // 조식: 메뉴마다 고른 사람들(부서·이름순) + 아직 안 고른 사람
    const byName = (a, b) => a.dept.localeCompare(b.dept, 'ko') || a.name.localeCompare(b.name, 'ko');
    const group = (title, list, cls = '') => `
      <div class="menu-group ${cls}">
        <p>${title} <b>${list.length}</b>명</p>
        <div class="chips">${[...list].sort(byName).map(chip).join('') || '<span class="empty">아직 없어요</span>'}</div>
      </div>`;
    const noMenu = people.filter((p) => !p.menu);
    $('#menuCount').textContent = `고름 ${people.length - noMenu.length}명 · 안 고름 ${noMenu.length}명`;
    $('#menus').innerHTML = MENU_KEYS.map((m) => group(MENUS[m], people.filter((p) => p.menu === m))).join('')
      + (noMenu.length ? group('아직 안 고른 사람', noMenu, 'none') : '');

    $('#totalCount').textContent = people.length ? `· 총 ${people.length}명` : '';
    if (editing != null && !people.some((p) => p.id === editing)) editing = null; // 고치던 사람이 그사이 명단에서 빠짐
    if (editing == null) renderTable(); else renderFacets(); // 수정 중에는 표의 줄만 그대로 두고, 분류 단추의 인원수는 계속 맞춤
    renderExtras();
  }

  // ── 명단 관리: 분류 · 찾기 · 정렬 ──
  // 보기 조건은 이 화면에만 있다(DB 는 건드리지 않고, 화면을 새로고침하면 처음으로 돌아감)
  const view = { q: '', dept: null, gender: null, exec: null, team: null, menu: null }; // 찾는 말 + 분류마다 고른 값(null = 전체)
  let sort = { key: 'dept', dir: 1 }; // dir: 1 = 차례대로, -1 = 거꾸로
  const byKo = (a, b) => a.localeCompare(b, 'ko');
  // 분류: of = 그 사람의 값, label = 단추에 보이는 글, values = 단추로 보여줄 값들
  const FACETS = [
    { key: 'dept', title: '부서', of: (p) => p.dept, label: (v) => v, values: () => [...new Set(people.map((p) => p.dept))].sort(byKo) },
    { key: 'gender', title: '성별', of: (p) => p.gender || '', label: (v) => v || '미입력', values: () => ['남', '여', ...(people.some((p) => !p.gender) ? [''] : [])] },
    { key: 'exec', title: '구분', of: (p) => (p.is_exec ? '임원' : '직원'), label: (v) => v, values: () => ['임원', '직원'] },
    { key: 'team', title: '팀', of: (p) => p.team || '', label: (v) => TEAMS[v] || '안 뽑음', values: () => [...TEAM_KEYS, ''] },
    { key: 'menu', title: '조식', of: (p) => p.menu || '', label: (v) => MENUS[v] || '안 고름', values: () => [...MENU_KEYS, ''] },
  ];
  const squash = (s) => String(s || '').normalize('NFC').toLowerCase().replace(/\s+/g, ''); // 찾을 때 띄어쓰기·대소문자는 무시(자모가 풀린 글자도 합쳐서 봄)
  // 이 사람이 지금 조건에 맞는지. skip = 빼고 볼 분류(단추의 인원수는 자기 분류의 조건만 빼고 셈)
  function matches(p, skip) {
    const k = squash(view.q);
    if (k && ![p.name, p.dept, p.title].some((s) => squash(s).includes(k))) return false;
    return FACETS.every((f) => f.key === skip || view[f.key] == null || f.of(p) === view[f.key]);
  }
  // 직급은 가나다순이 아니라 높은 순. 목록에 없는 직급은 임원이면 임원 끝, 아니면 맨 뒤, 직급이 없으면 그 뒤
  const RANKS = ['회장', '부회장', '대표이사', '대표', '사장', '부사장', '전무', '상무', '이사', '고문', '부장', '차장', '과장', '대리', '주임', '사원', '인턴'];
  const rankOf = (p) => { const i = RANKS.indexOf(p.title); return i >= 0 ? i : p.is_exec ? 9.5 : p.title ? RANKS.length : RANKS.length + 1; };
  const place = (list, v) => list.indexOf(v) + 1 || list.length + 1; // 목록에 없는 값(비어 있음)은 맨 뒤
  const SORTS = {
    dept: (a, b) => byKo(a.dept, b.dept),
    name: (a, b) => byKo(a.name, b.name),
    title: (a, b) => rankOf(a) - rankOf(b) || byKo(a.title || '', b.title || ''),
    gender: (a, b) => place(['남', '여'], a.gender) - place(['남', '여'], b.gender),
    team: (a, b) => place(TEAM_KEYS, a.team) - place(TEAM_KEYS, b.team),
    menu: (a, b) => place(MENU_KEYS, a.menu) - place(MENU_KEYS, b.menu),
  };
  const ordered = (list) => [...list].sort((a, b) => sort.dir * SORTS[sort.key](a, b) || byKo(a.dept, b.dept) || byKo(a.name, b.name));

  // 분류 단추 + "N명 중 M명" + 정렬 표시
  function renderFacets() {
    // 고른 값의 단추가 없어지면(부서 이름이 바뀜, 명단이 비워짐 등) 그 조건은 풂 — 안 보이는 조건이 걸린 채 남지 않게
    for (const f of FACETS) if (view[f.key] != null && !(people.length && f.values().includes(view[f.key]))) view[f.key] = null;

    const on = document.activeElement && document.activeElement.closest('#facets button');
    const at = on && { ...on.dataset }; // 초점이 있던 단추 — 다시 그린 뒤 같은 단추로 돌려줌(자동 새로고침 때 키보드 자리를 잃지 않게)
    $('#facets').innerHTML = !people.length ? '' : FACETS.map((f) => `
      <div class="facet" role="group" aria-label="${f.title}">
        <span class="facet-name">${f.title}</span>
        <div class="chips">${f.values().map((v) => {
          const n = people.filter((p) => matches(p, f.key) && f.of(p) === v).length;
          return `<button type="button" class="chip pick${n ? '' : ' zero'}" data-facet="${f.key}" data-value="${esc(v)}" aria-pressed="${view[f.key] === v}">${esc(f.label(v))} <b>${n}</b></button>`;
        }).join('')}</div>
      </div>`).join('');
    if (at) [...document.querySelectorAll('#facets button')].find((x) => x.dataset.facet === at.facet && x.dataset.value === at.value)?.focus();
    const hits = people.filter((p) => matches(p)).length;
    const narrowed = !!squash(view.q) || FACETS.some((f) => view[f.key] != null);
    $('#shown').textContent = narrowed && people.length ? `${people.length}명 중 ${hits}명` : '';
    $('#clearView').hidden = !narrowed;
    for (const b of document.querySelectorAll('.people th button')) {
      if (b.dataset.sort === sort.key) b.parentNode.setAttribute('aria-sort', sort.dir > 0 ? 'ascending' : 'descending');
      else b.parentNode.removeAttribute('aria-sort');
    }
  }

  // 분류 단추 + 명단 표. 수정 중인 줄은 입력칸으로 보여줌
  function renderTable() {
    renderFacets();
    // 고치던 줄은 조건에 안 맞아도 계속 보여 주고, 입력하던 값이 지워지지 않게 그 줄을 그대로 다시 끼워 넣음
    const shown = ordered(people.filter((p) => p.id === editing || matches(p)));
    const old = $('#peopleBody tr.editing');
    const kept = old && Number(old.dataset.id) === editing ? old : null;
    const team = (p) => (p.team ? `<span class="dot team-${p.team}">${TEAMS[p.team]}</span>` : '<span class="hint">-</span>');
    $('#deptList').innerHTML = [...new Set(people.map((p) => p.dept))].map((d) => `<option value="${esc(d)}">`).join('');
    $('#peopleBody').innerHTML = shown.map((p) => p.id === editing && kept ? '<tr data-slot></tr>' : p.id === editing ? `
      <tr class="editing" data-id="${p.id}">
        <td><input name="dept" value="${esc(p.dept)}" maxlength="50" list="deptList" aria-label="부서" /></td>
        <td><input name="name" value="${esc(p.name)}" maxlength="50" aria-label="이름" /></td>
        <td><input name="title" value="${esc(p.title || '')}" maxlength="30" placeholder="없음" aria-label="직급" /></td>
        <td><select name="gender" aria-label="성별">${['', '남', '여'].map((g) => `<option value="${g}"${(p.gender || '') === g ? ' selected' : ''}>${g || '-'}</option>`).join('')}</select></td>
        <td>${team(p)}</td>
        <td><select name="menu" aria-label="조식" data-was="${esc(p.menu || '')}">${['', ...MENU_KEYS].map((m) => `<option value="${m}"${(p.menu || '') === m ? ' selected' : ''}>${MENUS[m] || '-'}</option>`).join('')}</select></td>
        <td><button class="link" data-save>저장</button> · <button class="link" data-cancel>취소</button></td>
      </tr>` : `
      <tr>
        <td>${esc(p.dept)}</td>
        <td>${esc(p.name)}</td>
        <td>${esc(p.title || '-')}</td>
        <td>${esc(p.gender || '-')}</td>
        <td>${team(p)}</td>
        <td>${MENUS[p.menu] || '<span class="hint">-</span>'}</td>
        <td>
          <button class="link" data-edit="${p.id}">수정</button> ·
          ${p.team ? `<button class="link" data-reset="${p.id}" data-name="${esc(p.name)}">다시 뽑기</button> · ` : ''}
          <button class="link danger" data-remove="${p.id}" data-name="${esc(p.name)}">삭제</button>
        </td>
      </tr>`).join('') || `<tr><td colspan="7" class="empty">${people.length ? '조건에 맞는 사람이 없어요.' : '명단이 비어 있어요. 아래 명단 추가에 붙여넣어 주세요.'}</td></tr>`;
    if (kept) $('#peopleBody [data-slot]').replaceWith(kept);
  }

  $('#facets').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-facet]');
    if (!b) return;
    const { facet, value } = b.dataset;
    view[facet] = view[facet] === value ? null : value; // 고른 것을 한 번 더 누르면 풀림
    renderTable();
  });
  $('#q').addEventListener('input', () => { view.q = $('#q').value; renderTable(); });
  $('#clearView').addEventListener('click', () => {
    Object.assign(view, { q: '', dept: null, gender: null, exec: null, team: null, menu: null });
    $('#q').value = '';
    renderTable();
    $('#q').focus();
  });
  $('.people thead').addEventListener('click', (e) => {
    const key = e.target.dataset.sort;
    if (!key) return;
    sort = { key, dir: sort.key === key ? -sort.dir : 1 };
    renderTable();
  });
  // 지금 표에 보이는 사람들을 엑셀에서 열리는 파일(CSV)로 받음
  $('#exportBtn').addEventListener('click', guard(async () => {
    const list = ordered(people.filter((p) => matches(p)));
    if (!list.length) throw new Error('파일로 받을 사람이 없어요.');
    // 칸마다 따옴표로 감싸고, 엑셀이 수식으로 읽는 글자(= + - @)로 시작하면 앞에 ' 를 붙여 글자로만 읽히게 함
    const cell = (v) => `"${String(v ?? '').replace(/^[=+\-@\t\r]/, "'$&").replace(/"/g, '""')}"`;
    const lines = [['부서', '이름', '직급', '성별', '구분', '팀', '조식'],
      ...list.map((p) => [p.dept, p.name, p.title, p.gender, p.is_exec ? '임원' : '직원', TEAMS[p.team], MENUS[p.menu]])];
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([String.fromCharCode(0xFEFF) + lines.map((r) => r.map(cell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' })); // 맨 앞의 U+FEFF(BOM): 엑셀이 한글을 깨뜨리지 않게
    a.download = `워크숍_명단_${list.length}명.csv`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }));

  // 수정 줄을 닫고, 그 줄의 "수정" 단추로 초점을 돌려줌(키보드로 쓰는 사람이 자리를 잃지 않게)
  function stopEditing() {
    const id = editing;
    editing = null;
    renderTable();
    $(`#peopleBody [data-edit="${id}"]`)?.focus();
  }
  // 버튼으로 명단을 바꾼 뒤에는 수정 중이던 줄을 닫고 표 전체를 새로 그림
  // (drawn 을 비워 두면, 이 새로고침이 통신 문제로 실패해도 다음 자동 새로고침이 표를 꼭 다시 그려 수정 줄이 닫힘)
  function reload() { editing = null; drawn = ''; return refresh(true); }

  // 수정 저장. 실패하면(같은 이름 등) 입력칸을 그대로 두고 위쪽에 이유를 보여줌
  // 답을 기다리는 동안(saving)은 표의 다른 단추를 받지 않음 — 저장이 끝나며 표를 새로 그릴 때, 그사이 연 다른 줄의 입력이 말없이 사라지지 않게
  let saving = false;
  async function saveEdit() {
    const row = $('#peopleBody tr.editing');
    if (!row || saving) return;
    const id = Number(row.dataset.id);
    const v = (n) => row.querySelector(`[name="${n}"]`).value;
    const controls = row.querySelectorAll('input, select, button');
    controls.forEach((el) => { el.disabled = true; });
    const p_row = { dept: v('dept'), name: v('name'), title: v('title'), gender: v('gender') };
    // 조식은 진행자가 바꿨을 때만 보냄. 수정 줄을 열어 둔 사이 그 사람이 직접 고른 메뉴를 덮어쓰지 않게
    if (v('menu') !== row.querySelector('[name="menu"]').dataset.was) p_row.menu = v('menu');
    saving = true;
    $('#peopleBody').classList.add('busy');
    try {
      await rpc('admin_update', { p_code: code, p_id: id, p_row });
      await reload();
      if (document.activeElement === document.body) $(`#peopleBody [data-edit="${id}"]`)?.focus(); // 저장한 줄의 "수정" 단추로
    } finally {
      saving = false;
      $('#peopleBody').classList.remove('busy');
      controls.forEach((el) => { el.disabled = false; });
    }
  }

  // ── 일정표(참가자 화면에도 보임) · 준비해 둔 기능(시험용: 객실표·자유시간 — 진행자 화면에만 있음) ──
  // 값을 저장한 뒤 다시 받아 그림. reload() 와 달리 명단 표에서 고치던 줄은 닫지 않음.
  // 저장은 됐는데 다시 받기만 실패했으면 "다시 눌러 주세요"가 아니라 그 사실을 알림(다음 5초 새로고침이 화면을 맞추고 이 문구도 지움)
  let acting = 0; // 진행자가 방금 바꾼 것을 그리는 중(이때는 초점이 있는 칸도 다시 그림)
  async function resync() {
    drawn = '';
    acting++;
    try {
      await refresh(true);
    } catch (e) {
      if (e.message.includes('비밀번호')) throw e; // 비밀번호가 바뀌었으면 입력 화면으로 돌아가며 그 이유를 보여줌
      autoMsg = '저장은 됐어요. 화면은 잠시 뒤 저절로 맞춰져요.';
      showError(autoMsg);
    } finally {
      acting--;
    }
  }
  // 내용이 그대로면 다시 그리지 않음(누가 팀을 뽑아 5초 새로고침이 돌아도, 펼쳐 둔 고르는 칸이 닫히지 않게).
  // 내용이 바뀌었어도 진행자가 그 안의 고르는 칸을 잡고 있으면 5초 새로고침은 건드리지 않고, 칸에서 나올 때 맞춤
  const painted = new Map();
  const put = (sel, html) => {
    if (painted.get(sel) === html) return;
    const at = document.activeElement;
    if (!acting && at && at.matches('select.seat') && $(sel).contains(at)) return;
    painted.set(sel, html);
    $(sel).innerHTML = html;
  };
  // 저장이 실패했을 때: 고르는 칸을 저장된 값으로 되돌림
  const repaint = () => { painted.clear(); acting++; try { renderExtras(); } finally { acting--; } };
  const who = (p) => `${esc(p.name)} <span class="hint">${p.title ? esc(p.title) + ' · ' : ''}${esc(p.dept)}</span>`;
  const byRank = (a, b) => rankOf(a) - rankOf(b) || byKo(a.dept, b.dept) || byKo(a.name, b.name);
  // 이름 옆 고르는 칸("직접 옮기기"·"직접 고치기"를 켰을 때만). 객실은 그 사람 성별의 방만 고를 수 있고, 성별이 없으면 모든 방
  const SEATS = {
    room: { title: '객실', none: '방 없음', names: ROOMS, keys: (p) => ROOM_KEYS.filter((k) => !p.gender || roomGender(k) === p.gender || k === p.room) },
    activity: { title: '자유시간', none: '안 고름', names: ACTS, keys: () => ACT_KEYS },
  };
  const seat = (what, p) => `<select class="seat" data-seat="${what}" data-id="${p.id}" aria-label="${esc(p.name)} 님 ${SEATS[what].title}">${
    ['', ...SEATS[what].keys(p)].map((k) => `<option value="${k}"${(p[what] || '') === k ? ' selected' : ''}>${k ? SEATS[what].names[k] : SEATS[what].none}</option>`).join('')}</select>`;
  const crowd = (title, list, what, on, cls = '') => `
    <div class="menu-group ${cls}${on ? ' picking' : ''}">
      <p>${title} <b>${list.length}</b>명</p>
      <div class="chips">${list.map((p) => `<span class="chip">${who(p)}${on ? seat(what, p) : ''}</span>`).join('') || '<span class="empty">아직 없어요</span>'}</div>
    </div>`;

  function renderExtras() {
    const on = document.activeElement && document.activeElement.matches('select.seat') ? { ...document.activeElement.dataset } : null;

    // 일정표
    put('#plan', planHtml(conf.schedule) || '<p class="empty">아직 일정이 없어요. 아래 <b>일정 고치기</b>를 눌러 적어 주세요.</p>');
    $('#planCount').textContent = conf.schedule.trim() ? '' : '· 아직 없음';

    // 객실표: 방마다 직급 높은 순
    const move = $('#roomMove').checked;
    const housed = people.filter((p) => p.room).length;
    const roomless = people.filter((p) => !p.room).sort(byRank);
    $('#roomCount').textContent = `· 남자 ${ROOM_KEYS.filter((k) => roomGender(k) === '남').length}실 · 여자 ${ROOM_KEYS.filter((k) => roomGender(k) === '여').length}실 · `
      + (housed ? `${people.length}명 중 ${housed}명 배정` : '아직 안 나눔');
    put('#rooms', ROOM_KEYS.map((k) => {
      const list = people.filter((p) => p.room === k).sort(byRank);
      return `
        <div class="room">
          <h3><span>${ROOMS[k]}</span><span>${list.length}명</span></h3>
          <ul>${list.map((p) => `<li><span>${who(p)}</span>${p.gender && p.gender !== roomGender(k) ? '<span class="warn">성별이 방과 달라요</span>' : ''}${move ? seat('room', p) : ''}</li>`).join('')
            || '<li class="empty">비어 있어요</li>'}</ul>
        </div>`;
    }).join(''));
    // 방 없는 사람: 한 명이라도 나눈 뒤이거나 직접 옮기는 중일 때만 따로 보여줌(처음에는 전원이라 굳이 안 늘어놓음)
    put('#roomless', roomless.length && (housed || move) ? crowd('아직 방이 없는 사람', roomless, 'room', move, 'none') : '');
    $('#roomFill').hidden = !(housed && roomless.some((p) => p.gender));
    $('#roomClear').hidden = !housed;

    // 자유시간: 고른 것마다 사람들 + 아직 안 고른 사람
    const fix = $('#actMove').checked;
    const idle = people.filter((p) => !p.activity).sort(byRank);
    const doing = (k) => people.filter((p) => p.activity === k).sort(byRank);
    $('#actCount').textContent = `· ${ACT_KEYS.map((k) => `${ACTS[k]} ${doing(k).length}명`).join(' · ')} · 안 고름 ${idle.length}명`;
    put('#acts', ACT_KEYS.map((k) => crowd(ACTS[k], doing(k), 'activity', fix)).join('')
      + (idle.length ? crowd('아직 안 고른 사람', idle, 'activity', fix, 'none') : ''));
    $('#actClear').hidden = idle.length === people.length;

    // 고르는 칸에 있던 초점은 다시 그린 뒤에도 같은 사람의 칸으로
    if (on) document.querySelector(`select.seat[data-seat="${on.seat}"][data-id="${on.id}"]`)?.focus();
  }

  // 누르는 동안 그 단추를 잠가 두 번 눌리지 않게
  const hold = (btn, fn) => guard(async () => {
    btn.disabled = true;
    try { await fn(); } finally { btn.disabled = false; }
  });

  // 일정표 고치기: 글로 적어 저장하면 참가자 화면에도 그대로 나옴. 고치는 동안 5초 새로고침은 입력칸을 건드리지 않음
  const PLAN_SAMPLE = `12월 17일 (목)
13:00 오크밸리 도착 · 객실 배정
14:00~17:00 팀 게임
18:00 저녁 식사
19:30 자유시간 (스키 · 사우나)

12월 18일 (금)
08:00 조식
10:00~12:00 워크숍
12:00 점심 식사

12월 19일 (토)
08:00 조식
10:00 퇴실 · 출발`;
  const planEditing = (open) => { $('#planEdit').hidden = !open; $('#planEditBtn').hidden = open; };
  $('#planEditBtn').addEventListener('click', () => {
    $('#planInput').value = conf.schedule;
    planEditing(true);
    $('#planInput').focus();
  });
  $('#planCancel').addEventListener('click', () => { planEditing(false); $('#planEditBtn').focus(); });
  $('#planSample').addEventListener('click', () => {
    if ($('#planInput').value.trim() && !confirm('적어 둔 내용을 지우고 예시로 바꿀까요?\n저장을 누르기 전에는 일정표가 바뀌지 않아요.')) return;
    $('#planInput').value = PLAN_SAMPLE;
    $('#planInput').focus();
  });
  $('#planSave').addEventListener('click', hold($('#planSave'), async () => {
    await rpc('admin_set', { p_code: code, p_key: 'schedule', p_value: $('#planInput').value.trim() });
    await resync();
    planEditing(false);
    $('#planEditBtn').focus();
  }));

  // 객실 나누기 계획 [{ id, value: 방 }]. 성별마다 그 성별의 방들에 인원이 최대한 같게(차이 1명 이내) 나눈다.
  // 고른 기준의 순서로 줄을 세운 뒤 앞에서부터 한 방씩 채우므로, 순서가 이웃한 사람끼리 한 방이 된다(순서가 같은 사람끼리는 누를 때마다 무작위).
  // onlyNew 면 이미 방이 있는 사람은 그대로 두고, 방 없는 사람을 지금 인원이 가장 적은 방부터 한 명씩 넣는다.
  const shuffle = (list) => {
    const a = [...list];
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };
  const ROOM_RULES = {
    rank: (a, b) => rankOf(a) - rankOf(b),
    dept: (a, b) => byKo(a.dept, b.dept) || rankOf(a) - rankOf(b),
    team: (a, b) => place(TEAM_KEYS, a.team) - place(TEAM_KEYS, b.team),
    mix: () => 0,
  };
  function roomPlan(rule, onlyNew) {
    const rows = [];
    for (const g of ['남', '여']) {
      const keys = ROOM_KEYS.filter((k) => roomGender(k) === g);
      const list = shuffle(people.filter((p) => p.gender === g && !(onlyNew && p.room))).sort(ROOM_RULES[rule]);
      if (onlyNew) {
        const size = keys.map((k) => people.filter((p) => p.room === k).length);
        for (const p of list) {
          const i = size.indexOf(Math.min(...size));
          size[i]++;
          rows.push({ id: p.id, value: keys[i] });
        }
      } else {
        let from = 0;
        keys.forEach((k, n) => { // 예: 20명 ÷ 5실 = 4명씩, 9명 ÷ 2실 = 5명·4명(남는 사람은 앞쪽 방부터 한 명씩)
          const take = Math.floor(list.length / keys.length) + (n < list.length % keys.length ? 1 : 0);
          for (const p of list.slice(from, from + take)) rows.push({ id: p.id, value: k });
          from += take;
        });
      }
    }
    // 성별을 몰라 못 나눈 사람: 전부 새로 나눌 때는 예전 방도 비워 둠(방 인원이 어긋나지 않게)
    if (!onlyNew) for (const p of people) if (!p.gender && p.room) rows.push({ id: p.id, value: '' });
    return rows;
  }
  async function assignRooms(onlyNew) {
    const housed = people.filter((p) => p.room).length;
    if (!people.length) throw new Error('명단이 비어 있어요. 아래 명단 관리에서 먼저 추가해 주세요.');
    const unsexed = people.filter((p) => !p.gender && p.room).length; // 성별이 없어 못 나누는데 지금 방이 있는 사람
    if (!onlyNew && housed && !confirm(`이미 방이 정해진 ${housed}명을 포함해 전부 새로 나눌까요?` + (unsexed ? `\n성별이 없는 ${unsexed}명은 방이 비워져요.` : ''))) return;
    const rows = roomPlan($('#roomRule').value, onlyNew);
    const placed = rows.filter((r) => r.value).length;
    if (!placed) throw new Error('나눌 사람이 없어요. 성별이 들어 있는 사람만 나눌 수 있어요(아래 명단 관리에서 수정).');
    $('#roomMsg').textContent = '';
    await rpc('admin_assign', { p_code: code, p_what: 'room', p_rows: rows });
    await resync();
    const unknown = people.filter((p) => !p.gender && !p.room).length;
    $('#roomMsg').textContent = `${placed}명을 나눴어요.` + (unknown ? ` 성별이 없는 ${unknown}명은 넣지 못했어요. 직접 옮기기를 켜서 넣어 주세요.` : '');
  }
  $('#roomAuto').addEventListener('click', hold($('#roomAuto'), () => assignRooms(false)));
  $('#roomFill').addEventListener('click', hold($('#roomFill'), () => assignRooms(true)));
  $('#roomClear').addEventListener('click', hold($('#roomClear'), async () => {
    if (!confirm(`${people.filter((p) => p.room).length}명의 객실을 모두 비울까요? 되돌릴 수 없어요.`)) return;
    await rpc('admin_clear', { p_code: code, p_what: 'room' });
    $('#roomMsg').textContent = '';
    await resync();
  }));
  $('#actClear').addEventListener('click', hold($('#actClear'), async () => {
    if (!confirm(`${people.filter((p) => p.activity).length}명이 고른 자유시간을 모두 지울까요? 되돌릴 수 없어요.`)) return;
    await rpc('admin_clear', { p_code: code, p_what: 'activity' });
    await resync();
  }));
  $('#roomMove').addEventListener('change', renderExtras);
  $('#actMove').addEventListener('change', renderExtras);

  // 이름 옆 고르는 칸을 바꾸면 바로 저장. 실패하면 칸을 저장된 값으로 되돌림
  const onSeat = guard(async (el) => {
    if (el.dataset.seat === 'room') $('#roomMsg').textContent = ''; // "N명을 나눴어요"는 직접 옮긴 뒤에는 맞지 않으므로 지움
    try {
      await rpc('admin_assign', { p_code: code, p_what: el.dataset.seat, p_rows: [{ id: Number(el.dataset.id), value: el.value }] });
    } catch (e) {
      repaint();
      throw e;
    }
    await resync();
  });
  $('#boardView').addEventListener('change', (e) => { if (e.target.matches('select.seat')) onSeat(e.target); });
  // 고르는 칸에서 나오면, 잡고 있는 동안 미뤄 둔 그리기를 맞춤
  $('#boardView').addEventListener('focusout', (e) => { if (e.target.matches('select.seat')) setTimeout(renderExtras); });

  // 명단을 다시 받아 그림. force 가 아니면 바뀐 게 있을 때만 다시 그림
  async function refresh(force = false) {
    const mine = ++seq;
    loading++;
    try {
      const data = await rpc('board_state', { p_code: code }); // { people, schedule }
      if (mine !== seq) return; // 기다리는 사이 더 새 요청이 나갔으면 이 답은 버림
      $('#codeCard').hidden = true;
      $('#boardView').hidden = false;
      const snap = JSON.stringify(data);
      if (!force && snap === drawn) return;
      drawn = snap;
      people = data.people;
      conf = { schedule: data.schedule || '' };
      render();
    } catch (e) {
      if (mine === seq && e.message.includes('비밀번호')) { // 틀렸거나 미설정 → 다시 입력
        code = null;
        store.set(CODE_KEY, null);
        $('#boardView').hidden = true;
        $('#codeCard').hidden = false;
      }
      throw e;
    } finally {
      loading--;
    }
  }

  $('#codeForm').addEventListener('submit', guard(async (e) => {
    e.preventDefault();
    code = $('#code').value;
    await refresh();
    store.set(CODE_KEY, code);
    $('#code').value = '';
  }));

  // 명단 추가: 엑셀 4칸(이름·직급·성별·부서) 또는 "이름, 부서".
  // 줄에 탭이 있으면 탭으로만 나누고(엑셀에서 복사한 줄 — 칸 안의 쉼표는 그대로 둠), 없으면 쉼표로 나눈다.
  // 칸이 4개도 2개도 아니면 엉뚱한 칸이 이름·부서로 들어갈 수 있으므로 넣지 않고 알려준다. 너무 긴 값도 마찬가지(DB가 한 줄 때문에 전체를 거절함)
  $('#addBtn').addEventListener('click', guard(async () => {
    $('#addMsg').textContent = ''; // 지난번 결과("N명 추가")가 이번 실패 옆에 남아 있지 않게
    const rows = [], bad = [];
    for (const raw of $('#rosterInput').value.split(/\r?\n/)) {
      if (!raw.trim()) continue;
      const cells = (raw.includes('\t') ? raw.split('\t') : raw.split(',')).map((s) => s.trim());
      if (cells.length > 4 && cells.slice(4).every((c) => !c)) cells.length = 4; // 엑셀에서 빈 열까지 같이 복사한 경우: 뒤쪽 빈 칸은 버림
      if (cells.includes('이름') && cells.includes('부서')) continue; // 머리글 줄
      const row = cells.length === 4 ? { name: cells[0], title: cells[1], gender: cells[2], dept: cells[3] }
        : cells.length === 2 ? { name: cells[0], dept: cells[1] } : null;
      if (row && row.name && row.dept && row.name.length <= 50 && row.dept.length <= 50 && (row.title || '').length <= 30) rows.push(row);
      else bad.push(raw.trim());
    }
    if (!rows.length) {
      throw new Error(bad.length
        ? `형식이 안 맞아 한 줄도 추가하지 못했어요(${bad.length}줄). 엑셀의 이름·직급·성별·부서 4칸이나 "이름, 부서"로 적어 주세요.`
        : '추가할 줄이 없어요. "이름, 부서" 형식으로 적어 주세요.');
    }
    const added = await rpc('admin_add', { p_code: code, p_rows: rows });
    const skipped = rows.length - added;
    $('#addMsg').textContent = `${added}명 추가` + (skipped ? ` · 이미 있어서 건너뜀 ${skipped}명` : '') + (bad.length ? ` · 형식이 안 맞는 ${bad.length}줄은 입력칸에 남겨 뒀어요` : '');
    $('#rosterInput').value = bad.join('\n'); // 넣은 줄은 지우고, 못 넣은 줄만 남겨 고쳐서 다시 추가할 수 있게
    await reload();
  }));

  $('#peopleBody').addEventListener('click', (e) => {
    const d = e.target.dataset;
    // 단추가 아닌 곳(입력칸 등)을 누른 것은 그냥 둠 — 저장 실패 이유를 보며 입력칸을 고치는 중에 그 문구가 지워지지 않게
    if (saving) return;
    if (d.edit || d.reset || d.remove || 'cancel' in d || 'save' in d) onRowButton(e);
  });
  const onRowButton = guard(async (e) => {
    const { reset, remove, name, edit } = e.target.dataset;
    if (edit) { // 다른 줄을 고치던 중이면 그건 저장하지 않고 넘어감
      editing = Number(edit);
      renderTable();
      $('#peopleBody tr.editing input[name="name"]').focus();
      return;
    }
    if ('cancel' in e.target.dataset) return stopEditing();
    if ('save' in e.target.dataset) return saveEdit();
    if (reset) {
      if (!confirm(`${name} 님의 팀을 지우고 다시 뽑게 할까요? 조식 메뉴는 그대로 남아요.`)) return;
      await rpc('admin_reset', { p_code: code, p_id: Number(reset) });
    }
    if (remove) {
      if (!confirm(`${name} 님을 명단에서 지울까요?`)) return;
      await rpc('admin_remove', { p_code: code, p_id: Number(remove) });
    }
    if (reset || remove) await reload();
  });
  // 입력칸에서 Enter = 저장, Esc = 취소. 한글을 조합하는 중의 Enter·Esc 는 글자 입력의 일부라 무시하고,
  // 저장·취소 단추 위에서의 Enter 는 그 단추를 누르는 것이므로 건드리지 않음
  $('#peopleBody').addEventListener('keydown', (e) => {
    if (!e.target.closest('tr.editing') || e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter' && e.target.matches('input, select')) { e.preventDefault(); guard(saveEdit)(); }
    if (e.key === 'Escape') stopEditing();
  });

  $('#resetAll').addEventListener('click', guard(async () => {
    const teams = people.filter((p) => p.team).length, menus = people.filter((p) => p.menu).length;
    const kept = people.some((p) => p.room || p.activity) ? '\n객실과 자유시간은 지워지지 않고 그대로 남아요.' : ''; // 준비해 둔 기능을 쓰고 있을 때만 덧붙임
    if (!confirm(`모든 사람의 팀과 조식 메뉴를 지우고 처음부터 다시 하게 할까요?\n지금 팀을 뽑은 ${teams}명, 조식을 고른 ${menus}명의 기록이 지워지고 되돌릴 수 없어요.${kept}`)) return;
    await rpc('admin_reset_all', { p_code: code }); // 팀 + 조식. (admin_reset 은 팀만 지움)
    seen = null;
    await reload();
  }));
  $('#removeAll').addEventListener('click', guard(async () => {
    if (!confirm(`명단 ${people.length}명을 전부 지울까요?\n뽑은 팀과 고른 조식도 함께 사라지고 되돌릴 수 없어요.`)) return;
    await rpc('admin_remove', { p_code: code, p_id: null });
    await reload();
  }));
  $('#forget').addEventListener('click', () => { store.set(CODE_KEY, null); location.reload(); });

  // 시작 + 5초마다 새로고침(화면이 보일 때만, 앞선 새로고침의 답을 기다리는 중이면 건너뜀). 다른 탭에 갔다 돌아오면 바로 한 번.
  // 자동 새로고침은 화면 위의 오류 문구를 지우지 않는다(저장 실패 이유가 5초 만에 사라지지 않게).
  // 새로고침 자체가 실패하면 그 이유를 보여주고, 다시 성공하면 그 문구만 지운다(처음 열 때의 새로고침도 같은 방식)
  let autoMsg = '';
  const autoRefresh = () => {
    if (!code || document.hidden || loading) return;
    refresh().then(
      () => { if (autoMsg && $('#error').textContent === autoMsg) showError(''); autoMsg = ''; },
      (e) => { autoMsg = e.message; showError(autoMsg); },
    );
  };
  if (code) autoRefresh(); else $('#codeCard').hidden = false;
  setInterval(autoRefresh, 5000);
  document.addEventListener('visibilitychange', autoRefresh);
</script>
</body>
</html>
