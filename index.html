<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>팀 뽑기</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"
          integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R"
          crossorigin="anonymous"></script>
  <script src="common.js"></script>
  <style>
    .me { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 16px; }
    .me b { font-size: 17px; }
    .slot { aspect-ratio: 1; max-width: 260px; margin: 0 auto 16px; border-radius: 24px; display: grid; place-items: center;
            font-size: 44px; font-weight: 800; transition: background .08s; }
    :where(.slot) { background: var(--chip); color: var(--muted); } /* 우선순위 0 → .team-* 색이 항상 이김 */
    .slot.landed { animation: land .5s cubic-bezier(.2, 1.6, .4, 1); }
    @keyframes land { from { transform: scale(.85); } }
    .result-text { text-align: center; font-size: 17px; margin: 0 0 16px; min-height: 1.5em; }
    .result-text b { font-size: 20px; }
    @media (prefers-reduced-motion: reduce) { .slot, .slot.landed { transition: none; animation: none; } }
  </style>
</head>
<body>
<main class="narrow">
  <h1>팀 뽑기</h1>
  <p class="sub">부서와 이름으로 로그인한 뒤 <b>랜덤</b>을 누르면 팀 색이 정해져요.</p>
  <p class="error" id="error" role="alert"></p>

  <section class="card" id="loginCard" hidden>
    <form id="loginForm">
      <label>부서
        <select id="dept" required><option value="">불러오는 중…</option></select>
      </label>
      <label>이름
        <input id="name" required maxlength="50" autocomplete="off" placeholder="이름 입력" />
      </label>
      <button class="primary block" type="submit" id="loginBtn">로그인</button>
    </form>
  </section>

  <section class="card" id="meCard" hidden>
    <div class="me">
      <span><span class="hint" id="whoDept"></span> <b id="whoName"></b>님</span>
      <button class="link" id="logout">다른 사람으로 로그인</button>
    </div>
    <div class="slot" id="slot" aria-live="polite">?</div>
    <p class="result-text" id="resultText"></p>
    <button class="primary block" id="randomBtn">랜덤</button>
  </section>
</main>

<script>
  const ME_KEY = 'team-picker-me';
  let me = null; // { dept, name, team }

  function paint(team, landed = false) {
    const slot = $('#slot');
    slot.className = 'slot' + (team ? ` team-${team}` : '');
    slot.textContent = team ? TEAMS[team] : '?';
    if (landed) { void slot.offsetWidth; slot.classList.add('landed'); }
  }

  function showMe() {
    $('#loginCard').hidden = true;
    $('#meCard').hidden = false;
    $('#whoDept').textContent = me.dept;
    $('#whoName').textContent = me.name;
    if (me.team) {
      paint(me.team);
      $('#resultText').innerHTML = `<b>${TEAMS[me.team]}팀</b>이에요!`;
      $('#randomBtn').hidden = true;
    } else {
      paint(null);
      $('#resultText').textContent = '버튼을 눌러 팀을 뽑으세요. 한 번만 뽑을 수 있어요.';
      $('#randomBtn').hidden = false;
    }
  }

  async function showLogin() {
    me = null;
    store.set(ME_KEY, null);
    $('#meCard').hidden = true;
    $('#loginCard').hidden = false;
    const depts = await rpc('departments');
    $('#dept').innerHTML = depts.length
      ? '<option value="">부서 선택</option>' + depts.map((d) => `<option>${esc(d)}</option>`).join('')
      : '<option value="">아직 명단이 없어요</option>';
  }

  $('#loginForm').addEventListener('submit', guard(async (e) => {
    e.preventDefault();
    $('#loginBtn').disabled = true;
    try {
      const found = await rpc('login', { p_dept: $('#dept').value, p_name: $('#name').value });
      if (!found) throw new Error('명단에 없는 부서·이름이에요. 철자를 확인하거나 진행자에게 말해 주세요.');
      me = found;
      store.set(ME_KEY, { dept: me.dept, name: me.name });
      showMe();
    } finally {
      $('#loginBtn').disabled = false;
    }
  }));

  $('#logout').addEventListener('click', guard(showLogin));

  // 색이 빠르게 돌다가 점점 느려지며 결과에서 멈춤
  async function spin(resultPromise) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return resultPromise;
    let final = null, failed = null;
    resultPromise.then((t) => (final = t), (e) => (failed = e));
    const t0 = performance.now();
    let i = 0, delay = 60;
    for (;;) {
      if (failed) throw failed;
      const team = TEAM_KEYS[i++ % TEAM_KEYS.length];
      paint(team);
      if (final && performance.now() - t0 > 1500) {
        delay = Math.min(delay * 1.35, 420);
        if (delay >= 300 && team === final) return final;
      }
      await sleep(delay);
    }
  }

  $('#randomBtn').addEventListener('click', guard(async () => {
    $('#randomBtn').disabled = true;
    $('#logout').disabled = true;
    $('#resultText').textContent = '두구두구…';
    try {
      me.team = await spin(rpc('pick', { p_dept: me.dept, p_name: me.name }));
      showMe();
      paint(me.team, true);
    } catch (e) {
      showMe(); // 실패하면 원래 상태로
      throw e;
    } finally {
      $('#randomBtn').disabled = false;
      $('#logout').disabled = false;
    }
  }));

  // 시작: 이 기기에서 로그인했던 사람이면 바로 이어서
  guard(async () => {
    const saved = store.get(ME_KEY);
    me = saved ? await rpc('login', { p_dept: saved.dept, p_name: saved.name }) : null;
    me ? showMe() : await showLogin();
  })();
</script>
</body>
</html>
